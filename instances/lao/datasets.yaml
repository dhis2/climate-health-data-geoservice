# What scripts/ingest.py puts into this instance, in this order: vectors, tables, rasters.
# Vector ids are feature templates (plugins/vectors/); table ids are table templates
# (plugins/tables/); raster ids are dataset templates (built-in, open-geo-service-plugins, or
# plugins/rasters/).
#
# `start`/`end` apply to every raster unless one overrides them. A table takes only its own
# window, and without one everything its source has. The climate window should span every
# disease table: OpenDengue's LAO admin-1 data is 1998-01 to 2010-12. Each raster is ingested
# over its whole window in one request (CLIM-899), never with overwrite (CLIM-898).
start: "1998-01-01"
end: "2010-12-31"

vectors:
  - natural_earth_admin1              # admin-1 boundaries, the units OpenDengue matched to

tables:
  - opendengue_admin1                 # disease_cases: monthly dengue cases per admin-1 unit

rasters:
  - era5land_temperature_monthly      # mean_temperature (degC)
  - era5land_precipitation_monthly    # rainfall (mm, monthly total)
  - era5land_relative_humidity_daily  # mean_relative_humidity (%), monthly harmonisation later
  - id: worldpop_population_global2_100m  # population, 2020 applied to every period
    start: "2020"
    end: "2020"
