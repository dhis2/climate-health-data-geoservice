# Dengue case counts from OpenDengue, one row per boundary unit and period.
#
# The key is the unit and the period, so a join to the feature collection gives one value per
# unit and period. OpenDengue sometimes reports several names under one unit code (a renamed
# province, or units a boundary dataset gives one code): the plugin sums them into one row and
# keeps the names in `source_names`.
- id: opendengue
  name: OpenDengue cases per unit and period
  description: Reported dengue cases per boundary unit and period, from OpenDengue.
  columns:
    - name: collection_id
      type: string
      nullable: false
      description: Id of the feature collection the cases are reported on; joins to its GeoParquet.
    - name: feature_id
      type: string
      required: true
      nullable: false
      description: Code of the unit, the collection's identifier property (Natural Earth's iso_3166_2 at admin 1).
    - name: feature_name
      type: string
      description: Name of the unit in the feature collection when the row was written.
    - name: period_start
      type: date
      required: true
      nullable: false
      description: First day of the period the cases are for.
    - name: dengue_total
      type: double
      unit: cases
      required: true
      represents: value
      description: >-
        Reported dengue cases, all severities and methods of confirmation, summed over the
        OpenDengue records in source_names.
    - name: source_names
      type: string
      description: OpenDengue unit names summed into this row, joined with " + ".
    - name: source_rows
      type: int32
      description: Number of OpenDengue records summed into this row.
    - name: case_definition
      type: string
      description: OpenDengue's case_definition_standardised values of those records, joined with " + ".
    - name: release
      type: string
      description: OpenDengue release the row was read from, e.g. 1.3.1.
  key:
    - collection_id
    - feature_id
    - period_start
