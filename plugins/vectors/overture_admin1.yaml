# First-level administrative units (Overture `region`, admin level 1) for whichever instance loads
# it: the built-in `overture` provider defaults `bbox` to the instance extent and `country` to its
# extent.country_code, so one template serves every country. `class: land` keeps land areas only.
#
# No `release`: Overture keeps only its last few releases, so a pinned one stops working after
# about two months. The provider records the release it actually read as the collection's version.
#
# LICENCE: ODbL-1.0 (divisions incorporate OpenStreetMap) — attribution plus share-alike.
- id: overture_admin1
  name: Admin level 1 (Overture Maps)
  description: >-
    First-level administrative units (provinces, regions) for this instance's country, from
    Overture Maps divisions.
  license: ODbL-1.0
  attribution: © OpenStreetMap contributors, © Overture Maps Foundation
  source_url: https://docs.overturemaps.org/guides/divisions/
  id_property: id
  provider: overture
  params:
    theme: divisions
    filters:
      subtype: region
      class: land
